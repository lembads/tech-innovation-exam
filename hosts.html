<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu đồ Doanh số Smartphone</title>
    <!-- Tích hợp Tailwind CSS để tạo giao diện nhanh và đẹp mắt -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tích hợp thư viện Chart.js để vẽ biểu đồ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
        <!-- Vùng chứa biểu đồ -->
        <canvas id="smartphoneSalesChart"></canvas>
    </div>

    <script>
        // Lấy thẻ canvas từ HTML
        const ctx = document.getElementById('smartphoneSalesChart').getContext('2d');

        // Dữ liệu cho biểu đồ
        const salesData = {
            labels: ['Apple', 'Samsung', 'Xiaomi', 'Oppo'], // Nhãn cho trục X (các thương hiệu)
            datasets: [
                {
                    label: 'Doanh số năm 2020 (triệu)',
                    data: [85, 90, 50, 45], // Dữ liệu của năm 2020
                    backgroundColor: 'rgba(59, 130, 246, 0.7)', // Màu xanh cho cột 2020
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 1,
                    borderRadius: 8,
                },
                {
                    label: 'Doanh số năm 2023 (triệu)',
                    data: [95, 88, 75, 60], // Dữ liệu của năm 2023
                    backgroundColor: 'rgba(239, 68, 68, 0.7)', // Màu đỏ cho cột 2023
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1,
                    borderRadius: 8,
                }
            ]
        };

        // Cấu hình cho biểu đồ
        const chartOptions = {
            responsive: true, // Biểu đồ tự động thay đổi kích thước theo màn hình
            maintainAspectRatio: true,
            scales: {
                y: {
                    beginAtZero: true, // Trục Y bắt đầu từ 0
                    title: {
                        display: true,
                        text: 'Số lượng bán ra (triệu chiếc)',
                        font: {
                            size: 14,
                            weight: '500'
                        }
                    }
                },
                x: {
                     title: {
                        display: true,
                        text: 'Thương hiệu',
                        font: {
                            size: 14,
                            weight: '500'
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    position: 'top', // Chú thích nằm ở phía trên
                },
                title: {
                    display: true,
                    text: 'Doanh số Smartphone Toàn cầu (2020 & 2023)', // Tiêu đề chính của biểu đồ
                    font: {
                        size: 20,
                        weight: 'bold'
                    },
                    padding: {
                        top: 10,
                        bottom: 30
                    }
                },
                tooltip: {
                    // Tùy chỉnh hiển thị khi di chuột vào cột
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) {
                                label += ': ';
                            }
                            if (context.parsed.y !== null) {
                                label += context.parsed.y + ' triệu';
                            }
                            return label;
                        }
                    }
                }
            }
        };

        // Tạo một biểu đồ cột mới với dữ liệu và cấu hình đã định nghĩa
        const myBarChart = new Chart(ctx, {
            type: 'bar',
            data: salesData,
            options: chartOptions
        });
    </script>

</body>
</html>
